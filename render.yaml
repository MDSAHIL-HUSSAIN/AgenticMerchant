databases:
  - name: agentic-video-jobs-db
    plan: free

services:
  - type: web
    name: agentic-image-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DEMO_MODE
        value: "false"
      - key: DESIGN_COUNT
        value: "1"
      - key: VIDEO_POST_ENABLED
        value: "false"
      - key: GEMINI_WEB_VIDEO_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-video-jobs-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: GEMINI_VIDEO_WORKER_TOKEN
        sync: false
      - key: GEMINI_VIDEO_LEASE_SECONDS
        value: "600"
      - key: VIDEO_STORAGE_ENDPOINT
        sync: false
      - key: VIDEO_STORAGE_REGION
        value: auto
      - key: VIDEO_STORAGE_BUCKET
        sync: false
      - key: VIDEO_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: VIDEO_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: VIDEO_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: META_INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: META_FACEBOOK_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: DATA_DIR
        value: /tmp/agentic-data
      - key: STATE_DB_PATH
        value: /tmp/agentic-data/agentic-state.sqlite
      - key: WHATSAPP_HANDOFF_URL
        value: https://whatsapp-bot-1lmp.onrender.com/whatsapp/integrations/agentic/previews
      - key: DASHBOARD_HANDOFF_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: REMOVE_BG_API_KEY
        sync: false
      - key: REMOVE_BG_SIZE
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: SHOPIFY_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: SHOPIFY_CLOUDINARY_API_KEY
        sync: false
      - key: SHOPIFY_CLOUDINARY_API_SECRET
        sync: false
      - key: SHOPIFY_PUBLISH_URL
        value: https://storebot-shopify.onrender.com/process
      - key: SHOPIFY_PUBLISH_SECRET
        sync: false
